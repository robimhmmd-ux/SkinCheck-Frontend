# CI frontend SkinCheck (Laomera) — GitHub Actions.
# Dibuat 2026-11-13 untuk rubrik RPL (Testing & GitHub DevOps/CI-CD, 15%).
# Memverifikasi aplikasi Next.js bisa di-build di setiap push / pull request ke main.
# NEXT_PUBLIC_API_URL dibekukan saat build (seperti di Vercel) supaya
# getApiBase() tidak kosong — tanpa ini build tetap jalan tapi request API
# di hasil build akan gagal (BACKEND_NOT_CONFIGURED).
name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://skincheck-backend.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
